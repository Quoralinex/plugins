name: Q1X Repository Agent

on:
  pull_request:
    paths:
      - 'plugins/q1x-repository-agent/**'
      - '.github/workflows/q1x-repository-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate portable manifest and MCP shape
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const plugin = JSON.parse(fs.readFileSync('plugins/q1x-repository-agent/plugin.json', 'utf8'));
          const mcp = JSON.parse(fs.readFileSync('plugins/q1x-repository-agent/mcp.json', 'utf8'));
          if (plugin.$schema !== 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json') process.exit(1);
          if (plugin.name !== 'q1x-repository-agent') process.exit(1);
          if (mcp.$schema !== 'https://agent-plugins.org/schemas/1.0.0/mcp.schema.json') process.exit(1);
          const server = mcp.mcpServers?.['q1x-agent-platform'];
          if (!server || server.type !== 'streamable-http' || server.url !== 'https://agents.q1x.xyz/mcp') process.exit(1);
          NODE
      - name: Validate skill frontmatter
        shell: bash
        run: |
          grep -q '^name: repository-context$' plugins/q1x-repository-agent/skills/repository-context/SKILL.md
          grep -q '^description:' plugins/q1x-repository-agent/skills/repository-context/SKILL.md
          grep -q '^name: repository-delivery$' plugins/q1x-repository-agent/skills/repository-delivery/SKILL.md
          grep -q '^description:' plugins/q1x-repository-agent/skills/repository-delivery/SKILL.md
